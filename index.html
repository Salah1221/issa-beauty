<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/issa_beauty.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Warm the image CDN connection early (banner + product images / LCP). -->
  <link rel="preconnect" href="https://ik.imagekit.io" />
  <!-- Preload the two dominant UI font weights (body + headings/prices). With
       font-display:optional this avoids a swap-reflow while giving them the best
       chance to render on the first paint. -->
  <link rel="preload" href="/fonts/IBMPlexSansArabic-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/IBMPlexSansArabic-SemiBold.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Apply the saved theme before first paint to avoid a light-mode flash for
       dark-mode users. Kept inline and tiny so it runs before the app loads. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>

  <title>Issa Beauty</title>
  <meta name="description"
    content="Carefully curated beauty and skincare from Issa Beauty, Tripoli, Lebanon. Browse the collection and order with cash on delivery." />

  <!-- Default social share preview; individual routes override these at runtime. -->
  <meta property="og:site_name" content="Issa Beauty" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Issa Beauty" />
  <meta property="og:description"
    content="Carefully curated beauty and skincare from Issa Beauty, Tripoli, Lebanon." />
  <meta property="og:image" content="/issa_beauty.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Brand identity for search engines + link unfurlers. Static because it
       never changes per-page; disambiguates this shop (issabeauty.org, Tripoli,
       our official socials) from unrelated accounts using the same name. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HealthAndBeautyBusiness",
      "name": "Issa Beauty",
      "url": "https://issabeauty.org",
      "logo": "https://issabeauty.org/issa_beauty.png",
      "image": "https://issabeauty.org/issa_beauty.png",
      "email": "Mohamadissa76374336@gmail.com",
      "telephone": "+96176374336",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Qobbeh, near Najem's Shoes",
        "addressLocality": "Tripoli",
        "addressCountry": "LB"
      },
      "sameAs": [
        "https://www.instagram.com/issabeauty20",
        "https://tiktok.com/@mohamad.issa2323"
      ]
    }
  </script>
</head>

<body>
  <div id="root" class="bg-background min-h-[100vh]" data-vaul-drawer-wrapper></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
