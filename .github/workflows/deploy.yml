name: Deploy Storefront (static)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

# The storefront is a static SPA (Vite app at the repo root) served directly by
# nginx. It talks to the standalone backend at api.issabeauty.org, so this deploy
# only builds and ships dist/ — no server, no .env, no PM2.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Build (bakes in VITE_API_BASE_URL from .env.production)
        run: |
          pnpm install
          pnpm run build

      - name: Write SSH deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy static bundle with rsync (retry on transient SSH drops)
        # The server silently drops one of two near-simultaneous SSH connections (an
        # anti-brute-force / connection-rate rule), which the storefront usually loses
        # when it deploys alongside the dashboard — the SYN is dropped, so it hangs and
        # times out rather than failing fast. ConnectTimeout kills a dropped attempt in
        # 15s and we retry after the burst window passes. --chown/--chmod land the files
        # owned by nginx (www-data) and readable, so no manual chown is ever needed
        # (rsync runs as root on the remote).
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 20
          command: >-
            rsync -avz --delete --chown=www-data:www-data --chmod=D755,F644
            -e "ssh -i $HOME/.ssh/deploy_key -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            ./dist/ "${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/issa-beauty/client/dist/"
