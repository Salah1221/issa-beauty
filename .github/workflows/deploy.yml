name: Deploy Storefront (static)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

# The storefront is a static SPA (Vite app at the repo root) served directly by
# nginx. It talks to the standalone backend at api.issabeauty.org, so this deploy
# only builds and ships dist/ — no server, no .env, no PM2.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Build (bakes in VITE_API_BASE_URL from .env.production)
        run: |
          pnpm install
          pnpm run build

      - name: Deploy static bundle with rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          # Mirror the fresh build into the web root; --delete clears stale hashed assets.
          # --chown/--chmod land the files owned by nginx (www-data) and readable, so no
          # manual `chown -R www-data:www-data` is ever needed (rsync runs as root here).
          switches: -avz --delete --chown=www-data:www-data --chmod=D755,F644
          path: ./dist/
          remote_path: /var/www/issa-beauty/client/dist/
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
